[package]
name = "avail-api"
version = "0.1.0"
edition = "2021"
# Not part of any Cargo workspace on purpose — this directory sits outside
# the npm workspace globs too (see docs/rust-api-migration-plan.md), so it
# cannot affect `npm install` or any existing script.

[lib]
name = "avail_api"
path = "src/lib.rs"

[[bin]]
name = "avail-api"
path = "src/main.rs"

[[bin]]
name = "avail-worker"
path = "src/bin/worker.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
aes-gcm = "0.10"
scrypt = "0.11"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
base64 = "0.22"
thiserror = "1"
hex = "0.4"
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2"
futures-util = "0.3"
tokio-stream = "0.1"
regex = "1"
tokio-util = "0.7"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
